services:
  api:
    build: .
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: modo_shake
      DB_USER: ${MYSQL_USER:?Configura MYSQL_USER en .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - taller

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: modo_shake
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configura MYSQL_ROOT_PASSWORD en .env}
      MYSQL_USER: ${MYSQL_USER:?Configura MYSQL_USER en .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configura MYSQL_PASSWORD en .env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - taller
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM pedidos LIMIT 1'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

networks:
  taller:
    driver: bridge

volumes:
  mysql_data:
