# Configuracion local activada por la accion Ejecutar proyecto de NetBeans.
spring.config.import=file:./.env[.properties]
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/modo_shake?allowPublicKeyRetrieval=true&sslMode=DISABLED&connectionTimeZone=UTC
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
# Evita reutilizar archivos de la interfaz durante el desarrollo local.
spring.web.resources.cache.cachecontrol.no-store=true
